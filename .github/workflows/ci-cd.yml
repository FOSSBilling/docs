name: CI/CD
run-name: ${{ github.event.pull_request && format('PR {0} {1}', github.event.pull_request.number, github.event.action) || github.event.head_commit.message || github.ref_name }}

on:
  push:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  # Notifications and deleted pushes must not cancel a branch build or deployment.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.event.deleted || github.event.action == 'closed') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validation:
    name: ${{ github.event.action == 'closed' && 'Validation (PR event)' || 'Validation' }}
    if: &check-source ${{ !github.event.deleted && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        id: dependencies
        run: npm ci

      - name: Check Formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run format:check

      - name: Astro Checks
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run check

  build:
    name: ${{ github.event.action == 'closed' && 'Build (PR event)' || 'Build' }}
    if: *check-source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          # The preview must contain the PR head recorded on the CI run.
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate Worker Deployment
        run: npm run cf-deploy -- --prebuilt --dry-run --mode production

      - name: Upload Worker Build
        if: >-
          github.repository == 'FOSSBilling/docs' &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))
        uses: actions/upload-artifact@v7.0.2
        with:
          name: worker-build
          overwrite: true
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 1 }}

  preview:
    name: Cloudflare Preview
    needs: [validation, build]
    if: ${{ !cancelled() && github.repository == 'FOSSBilling/docs' && github.event_name == 'push' && !github.event.deleted && github.ref_type == 'branch' && !startsWith(github.ref_name, 'forkpreview-') && github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@415540b79f2d744d6808670b933a599d4a740ba9 # main
    with:
      operation: deploy
      mode: preview
      cli: cf
      build-result: ${{ needs.build.result }}
      checks-result: ${{ needs.validation.result }}
      pr-comment: true
      pr-base-branch: main
      environment: preview
      artifact-name: worker-build
      artifact-path: .cloudflare/output/
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy Production
    needs: [validation, build]
    if: github.repository == 'FOSSBilling/docs' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@415540b79f2d744d6808670b933a599d4a740ba9 # main
    with:
      operation: deploy
      mode: production
      cli: cf
      prebuilt: true
      environment: production
      artifact-name: worker-build
      artifact-path: .cloudflare/output/
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
