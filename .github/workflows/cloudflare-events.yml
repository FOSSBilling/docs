name: Cloudflare Events

on:
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  delete:

# Serialize fork publication and cleanup; ordinary branch events keep their own runs.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.event == 'pull_request_review' || github.event.workflow_run.event == 'pull_request') && 'docs-fork-previews' || github.run_id }}
  queue: max

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.repository == 'FOSSBilling/docs' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push') ||
       (github.event_name == 'pull_request' && github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@415540b79f2d744d6808670b933a599d4a740ba9 # main
    with:
      operation: sync-pr-comment
      build-workflow: ci-cd.yml
      pr-base-branch: main

  cleanup:
    name: Delete Cloudflare Preview
    if: >-
      github.repository == 'FOSSBilling/docs' &&
      !startsWith(github.event.pull_request.head.ref || github.event.ref, 'forkpreview-') &&
      ((github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'delete' && github.event.ref_type == 'branch'))
    permissions:
      contents: read
    # Share the branch's push CI group so cleanup waits for its preview deployment.
    concurrency:
      group: CI/CD-push-refs/heads/${{ github.event.pull_request.head.ref || github.event.ref }}
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@415540b79f2d744d6808670b933a599d4a740ba9 # main
    with:
      operation: delete-preview
      worker-name: docs
      environment: preview
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  prepare-fork-preview:
    if: >-
      github.event_name == 'workflow_run' && github.repository == 'FOSSBilling/docs' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_review')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      target: ${{ steps.review.outputs.result }}
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Find the approved CI build
        id: review
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const match = /^PR ([1-9]\d*) (opened|reopened|synchronize|submitted|closed)$/.exec(run.display_title);
            // Review and close runs complete with all CI jobs skipped. The build itself must succeed below.
            if (!match || run.path !== '.github/workflows/ci-cd.yml' || !['skipped', 'success'].includes(run.conclusion)) return null;
            const number = Number(match[1]);
            const repo = context.repo;
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
            if (pr.base.ref !== 'main' || pr.head.repo?.id === pr.base.repo.id) return null;
            if (match[2] === 'closed' && run.event === 'pull_request')
              return pr.state === 'closed' ? { operation: 'delete-preview', number } : null;
            if (pr.state !== 'open' || !pr.head.repo) return null;

            // Either CI or approval may finish first. Always identify the same upstream CI build.
            const sha = pr.head.sha;
            const matches = r => r.event === 'pull_request' && r.head_sha === sha &&
              r.head_repository?.id === pr.head.repo.id && r.head_branch === pr.head.ref &&
              ['opened', 'reopened', 'synchronize'].some(action => r.display_title === `PR ${number} ${action}`);
            let build = run;
            if (match[2] === 'submitted' && run.event === 'pull_request_review') {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...repo, workflow_id: 'ci-cd.yml', event: 'pull_request', head_sha: sha, per_page: 100,
              });
              build = runs.find(matches);
            }
            if (build?.path !== '.github/workflows/ci-cd.yml' || !matches(build) || build.conclusion !== 'success') return null;
            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...repo, pull_number: number, per_page: 100 });
            const latest = new Map();
            for (const r of reviews) {
              if (['APPROVED', 'DISMISSED', 'CHANGES_REQUESTED'].includes(r.state)) latest.set(r.user.id, r);
            }
            for (const r of latest.values()) {
              if (r.state !== 'APPROVED' || r.commit_id !== sha || r.user.type !== 'User') continue;
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...repo, username: r.user.login });
              if (!['admin', 'write'].includes(data.permission)) continue;
              const comments = await github.paginate(github.rest.issues.listComments, { ...repo, issue_number: number, per_page: 100 });
              if (comments.some(c => c.user.login === 'github-actions[bot]' && c.body.startsWith(`<!-- fork-preview-run:${build.id} -->`))) return null;
              return { operation: 'deploy', number, sha, run: build.id };
            }
            return null;

  preview:
    needs: prepare-fork-preview
    # Rerun all jobs to obtain a fresh authorization on retries.
    if: >-
      needs.prepare-fork-preview.outputs.attempt == github.run_attempt &&
      needs.prepare-fork-preview.outputs.target != 'null' && needs.prepare-fork-preview.outputs.target != ''
    permissions:
      contents: read
      actions: read
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@b6637a0dda8ccd8d54fb3c3fafbb3a0bbbc4f4fe # main
    with:
      operation: ${{ fromJSON(needs.prepare-fork-preview.outputs.target).operation }}
      preview-name: forkpreview-${{ fromJSON(needs.prepare-fork-preview.outputs.target).number }}
      worker-name: docs
      environment: preview
      mode: preview
      cli: cf
      node-version: '26'
      artifact-name: worker-build
      artifact-run-id: ${{ format('{0}', fromJSON(needs.prepare-fork-preview.outputs.target).run || '') }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  fork-comment:
    needs: [prepare-fork-preview, preview]
    if: needs.preview.outputs.preview-build-url != ''
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9.0.0
        env:
          TARGET: ${{ needs.prepare-fork-preview.outputs.target }}
          NAME: ${{ needs.preview.outputs.preview-name }}
          URL: ${{ needs.preview.outputs.preview-build-url }}
        with:
          script: |
            const { number, sha, run } = JSON.parse(process.env.TARGET);
            if (process.env.NAME !== `forkpreview-${number}`) throw new Error('Unexpected preview name');
            await github.rest.issues.createComment({ ...context.repo, issue_number: number,
              body: `<!-- fork-preview-run:${run} -->\nPreview of reviewed commit ${sha}: <${process.env.URL}>` });
