name: Cloudflare Events

on:
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  delete:

# Serialize fork publication and cleanup; ordinary branch events keep their own runs.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && 'docs-fork-previews' || github.run_id }}
  queue: max

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.repository == 'FOSSBilling/docs' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push') ||
       (github.event_name == 'pull_request' && github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@db39bebe03eb4bb85b150ea48f82ed234aa04e84 # main
    with:
      operation: sync-pr-comment
      build-workflow: ci-cd.yml
      pr-base-branch: main

  cleanup:
    name: Delete Cloudflare Preview
    if: >-
      github.repository == 'FOSSBilling/docs' &&
      !startsWith(github.event.pull_request.head.ref || github.event.ref, 'forkpreview-') &&
      ((github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'delete' && github.event.ref_type == 'branch'))
    permissions:
      contents: read
      actions: read
    # Share the branch's push CI group so cleanup waits for its preview deployment.
    concurrency:
      group: CI/CD-push-refs/heads/${{ github.event.pull_request.head.ref || github.event.ref }}
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@db39bebe03eb4bb85b150ea48f82ed234aa04e84 # main
    with:
      operation: delete-preview
      worker-name: docs
      environment: preview
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  prepare-fork-preview:
    if: >-
      github.event_name == 'workflow_run' && github.repository == 'FOSSBilling/docs' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      target: ${{ steps.build.outputs.result }}
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Match the CI run to the fork PR
        id: build
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const match = /^PR ([1-9]\d*) (opened|reopened|synchronize|closed)$/.exec(run.display_title);
            // Close runs complete with all CI jobs skipped. The build itself must succeed below.
            if (!match || run.path !== '.github/workflows/ci-cd.yml' || !['skipped', 'success'].includes(run.conclusion)) return null;
            const number = Number(match[1]);
            const repo = context.repo;
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
            if (pr.base.ref !== 'main' || pr.head.repo?.id === pr.base.repo.id) return null;
            if (match[2] === 'closed')
              return pr.state === 'closed' ? { operation: 'delete-preview', number } : null;
            if (run.conclusion !== 'success' || pr.state !== 'open' || !pr.head.repo ||
                run.head_repository?.id !== pr.head.repo.id || run.head_branch !== pr.head.ref ||
                run.head_sha !== pr.head.sha) return null;
            return { operation: 'deploy', number, run: run.id };

  preview:
    needs: prepare-fork-preview
    # Rerun all jobs to recheck the PR head on retries.
    if: >-
      needs.prepare-fork-preview.outputs.attempt == github.run_attempt &&
      needs.prepare-fork-preview.outputs.target != 'null' && needs.prepare-fork-preview.outputs.target != ''
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@db39bebe03eb4bb85b150ea48f82ed234aa04e84 # main
    with:
      operation: ${{ fromJSON(needs.prepare-fork-preview.outputs.target).operation }}
      preview-name: forkpreview-${{ fromJSON(needs.prepare-fork-preview.outputs.target).number }}
      pr-comment: true
      fork-pr-number: ${{ fromJSON(needs.prepare-fork-preview.outputs.target).operation == 'deploy' && format('{0}', fromJSON(needs.prepare-fork-preview.outputs.target).number) || '' }}
      worker-name: docs
      environment: preview
      mode: preview
      cli: cf
      node-version: '26'
      artifact-name: worker-build
      artifact-run-id: ${{ format('{0}', fromJSON(needs.prepare-fork-preview.outputs.target).run || '') }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
