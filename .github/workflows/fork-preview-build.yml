name: Fork Preview Build
run-name: Fork preview PR ${{ github.event.pull_request.number }} review ${{ github.event.review.id || 'closed' }}

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  build:
    if: >-
      github.repository == 'FOSSBilling/docs' && github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: fork-site-${{ github.run_attempt }}
          path: .cloudflare/output/v1/workers/default/assets/
          if-no-files-found: error
          retention-days: 1
