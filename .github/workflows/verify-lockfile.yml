name: Verify Workflow Lockfile
on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
permissions:
  contents: read

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.5.1
      - name: Verify actions.lock
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
