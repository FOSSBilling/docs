name: Publish Reviewed Fork Preview

on:
  workflow_run:
    workflows: ['CI/CD', 'Cloudflare Events']
    types: [completed]

permissions: {}

# Check the current review after queueing, and finish publication before cleanup.
concurrency:
  group: docs-fork-preview-publication
  queue: max

jobs:
  resolve:
    if: >-
      github.repository == 'FOSSBilling/docs' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_review')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      target: ${{ steps.current.outputs.result }}
      attempt: ${{ github.run_attempt }}
      artifact-name: checked-fork-site-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@v9.0.0
        id: review
        with:
          script: return (await require('./.github/fork-preview/authorize.cjs')({ github, context })) || null;
      - name: Download the approved CI build
        if: fromJSON(steps.review.outputs.result).operation == 'deploy'
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ fromJSON(steps.review.outputs.result).run }}
          name: fork-site-${{ fromJSON(steps.review.outputs.result).sha }}
          path: ${{ runner.temp }}/site
      - name: Prepare static assets
        if: fromJSON(steps.review.outputs.result).operation == 'deploy'
        working-directory: ${{ runner.temp }}/site
        run: |
          test -f index.html
          if find . ! -type f ! -type d -print -quit | grep -q .; then exit 1; fi
          printf '/*\n  X-Robots-Tag: noindex\n' > _headers
      - name: Pass checked static files to the publisher
        if: fromJSON(steps.review.outputs.result).operation == 'deploy'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: checked-fork-site-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/site
            !${{ runner.temp }}/site/_worker.js
            !${{ runner.temp }}/site/_routes.json
          retention-days: 1
          if-no-files-found: error

      - name: Recheck the head and approval before publishing
        if: steps.review.outputs.result != 'null'
        uses: actions/github-script@v9.0.0
        id: current
        env:
          STAGED: ${{ steps.review.outputs.result }}
        with:
          script: |
            const current = await require('./.github/fork-preview/authorize.cjs')({ github, context });
            const staged = JSON.parse(process.env.STAGED);
            return current?.operation === staged.operation && current.sha === staged.sha && current.run === staged.run ? current : null;

  preview:
    needs: resolve
    # Rerun all jobs to obtain a fresh authorization on retries.
    if: >-
      needs.resolve.outputs.attempt == github.run_attempt &&
      needs.resolve.outputs.target != 'null' && needs.resolve.outputs.target != ''
    permissions:
      contents: read
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@b616a8cbccff1308f5029ea9ca31dd5a9c7a043e # main
    with:
      operation: ${{ fromJSON(needs.resolve.outputs.target).operation }}
      preview-name: forkpreview-${{ fromJSON(needs.resolve.outputs.target).number }}
      worker-name: docs
      environment: preview
      mode: preview
      cli: cf
      node-version: '26'
      artifact-name: ${{ needs.resolve.outputs.artifact-name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  comment:
    needs: [resolve, preview]
    if: needs.preview.outputs.preview-build-url != ''
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9.0.0
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
          NAME: ${{ needs.preview.outputs.preview-name }}
          URL: ${{ needs.preview.outputs.preview-build-url }}
        with:
          script: |
            const { number, sha, run } = JSON.parse(process.env.TARGET);
            if (process.env.NAME !== `forkpreview-${number}`) throw new Error('Unexpected preview name');
            await github.rest.issues.createComment({ ...context.repo, issue_number: number,
              body: `<!-- fork-preview-run:${run} -->\nPreview of reviewed commit ${sha}: <${process.env.URL}>` });
