name: Publish Reviewed Fork Preview

on:
  workflow_run:
    workflows: ['Fork Preview Build']
    types: [completed]

permissions: {}

jobs:
  resolve:
    if: >-
      github.repository == 'FOSSBilling/docs' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'pull_request_review' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      target: ${{ steps.review.outputs.result }}
      artifact-name: checked-fork-site-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@v9.0.0
        id: review
        with:
          script: return (await require('./.github/fork-preview/authorize.cjs')({ github, context })) || null;
      - name: Download this build's static files
        if: fromJSON(steps.review.outputs.result).operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=fork-site-$ATTEMPT" |
            jq -er '.artifacts | select(length == 1) | .[0] | select(.expired == false and .size_in_bytes <= 67108864) | .id')
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/site.zip"
          python3 .github/fork-preview/extract.py "$RUNNER_TEMP/site.zip" "$RUNNER_TEMP/site"
      - name: Pass checked static files to the publisher
        if: fromJSON(steps.review.outputs.result).operation == 'deploy'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: checked-fork-site-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
          retention-days: 1
          if-no-files-found: error

  preview:
    needs: resolve
    if: needs.resolve.outputs.target != 'null' && needs.resolve.outputs.target != ''
    concurrency:
      group: fork-preview-pr-${{ fromJSON(needs.resolve.outputs.target).number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@10804665b406ab8c91230288fd77f267debe8d2e
    with:
      operation: ${{ fromJSON(needs.resolve.outputs.target).operation }}
      reviewed-pr: ${{ fromJSON(needs.resolve.outputs.target).number }}
      review-authorization: .github/fork-preview/authorize.cjs
      worker-name: docs
      environment: preview
      mode: preview
      cli: cf
      node-version: '26'
      artifact-name: ${{ needs.resolve.outputs.artifact-name }}
      pr-comment: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
