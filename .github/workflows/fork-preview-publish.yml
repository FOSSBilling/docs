name: Publish Reviewed Fork Preview

on:
  workflow_run:
    workflows: ['Fork Preview Build']
    types: [completed]

# Queue through authorization, publication and cleanup so an older run cannot
# recreate a preview after its close event has been processed.
concurrency:
  group: docs-fork-preview-publication
  queue: max

permissions: {}

jobs:
  resolve:
    if: >-
      github.repository == 'FOSSBilling/docs' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'pull_request_review' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      target: ${{ steps.current.outputs.result }}
      attempt: ${{ github.run_attempt }}
      artifact-name: checked-fork-site-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@v9.0.0
        id: review
        with:
          script: return (await require('./.github/fork-preview/authorize.cjs')({ github, context })) || null;
      - name: Download this build's static files
        if: fromJSON(steps.review.outputs.result).operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=fork-site-$ATTEMPT" |
            jq -er '.artifacts | select(length == 1) | .[0] | select(.expired == false and .size_in_bytes <= 67108864) | .id')
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/site.zip"
          python3 .github/fork-preview/extract.py "$RUNNER_TEMP/site.zip" "$RUNNER_TEMP/site"
      - name: Pass checked static files to the publisher
        if: fromJSON(steps.review.outputs.result).operation == 'deploy'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: checked-fork-site-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
          retention-days: 1
          if-no-files-found: error

      - name: Confirm the PR and review before handing off to Cloudflare
        if: steps.review.outputs.result != 'null'
        uses: actions/github-script@v9.0.0
        id: current
        with:
          script: return (await require('./.github/fork-preview/authorize.cjs')({ github, context })) || null;

  preview:
    needs: resolve
    # Rerun all jobs to obtain a fresh authorization on retries.
    if: >-
      needs.resolve.outputs.attempt == github.run_attempt &&
      needs.resolve.outputs.target != 'null' && needs.resolve.outputs.target != ''
    permissions:
      contents: read
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@b616a8cbccff1308f5029ea9ca31dd5a9c7a043e # main
    with:
      operation: ${{ fromJSON(needs.resolve.outputs.target).operation }}
      preview-name: forkpreview-${{ fromJSON(needs.resolve.outputs.target).number }}
      worker-name: docs
      environment: preview
      mode: preview
      cli: cf
      node-version: '26'
      artifact-name: ${{ needs.resolve.outputs.artifact-name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  comment:
    needs: [resolve, preview]
    if: needs.preview.outputs.preview-build-url != ''
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9.0.0
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
          NAME: ${{ needs.preview.outputs.preview-name }}
          URL: ${{ needs.preview.outputs.preview-build-url }}
        with:
          script: |
            const { number, sha } = JSON.parse(process.env.TARGET);
            if (process.env.NAME !== `forkpreview-${number}`) throw new Error('Unexpected preview name');
            const marker = `<!-- fork-preview:${sha} -->`;
            const body = marker + '\nPreview of reviewed commit ' + sha + ': <' + process.env.URL + '>';
            const issue = { ...context.repo, issue_number: number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
